name: Build IPES 8CH DWIN APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: flutter create --platforms=android --org com.ipes --project-name ipes_8ch_dwin_logger .

      - name: Configure DWIN USB host and landscape
        shell: python
        run: |
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          if 'android.hardware.usb.host' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-feature android:name="android.hardware.usb.host" android:required="true" />')
          if 'android:screenOrientation=' not in s:
              s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity"\n            android:screenOrientation="landscape"')
          p.write_text(s)

      - name: Get dependencies
        run: flutter pub get

      - name: Repair legacy usb_serial Android build for current Flutter
        shell: bash
        run: |
          echo "android.newDsl=false" >> android/gradle.properties
          PLUGIN_DIR="$HOME/.pub-cache/hosted/pub.dev/usb_serial-0.5.2/android"
          cat > "$PLUGIN_DIR/build.gradle" <<'GRADLE'
          group 'dev.bessems.usbserial'
          version '1.0'

          rootProject.allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url "https://jitpack.io" }
              }
          }

          apply plugin: 'com.android.library'

          android {
              namespace 'dev.bessems.usbserial'
              compileSdk 35

              defaultConfig {
                  minSdk 21
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation 'com.github.felHR85:UsbSerial:6.1.0'
          }
          GRADLE

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare named APK
        run: cp build/app/outputs/flutter-apk/app-release.apk IPES_8CH_DWIN_Android_v1.1.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPES_8CH_DWIN_Android_v1.1_APK
          path: IPES_8CH_DWIN_Android_v1.1.apk
          if-no-files-found: error
          retention-days: 30
